# Temporary diagnostic — checks secret presence/shape without revealing it. Deleted after use.
name: pdlc-secret-probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check ANTHROPIC_API_KEY shape
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "VERDICT: EMPTY or not visible to Actions"; exit 0; fi
          echo "VERDICT: present, length ${#KEY}, prefix $(printf '%s' "$KEY" | cut -c1-6)…"
          case "$KEY" in
            sk-ant-*) echo "SHAPE: looks like an Anthropic API key" ;;
            *" "*|*$'\n'*) echo "SHAPE: WARNING contains whitespace/newline" ;;
            *) echo "SHAPE: unexpected prefix" ;;
          esac
