# dispatch-claude.yml — the program-default Claude dispatch path (D2):
#   Jira Automation / spine  ->  POST /repos/{owner}/{repo}/dispatches
#   (event_type "claude-dispatch")  ->  this workflow  ->  anthropics/claude-code-action@v1.
# Copy to the adopter repo as .github/workflows/dispatch-claude.yml.
# PLACEHOLDERS: secrets.ANTHROPIC_API_KEY (or OIDC federation inputs — see comments),
#   nothing else. The client_payload is produced by the spine's dispatch adapter and
#   NEVER contains callback URLs or tokens (D20) — completion flows back via
#   workflow_run / PR events observed by the relay.
#
# ASSUMPTION (docs/research/claude-platform.md §3): claude-code-action@v1 is GA;
# automation mode takes a `prompt` input and is deny-by-default on tools until
# granted via claude_args. Re-verify input names against the action's README on install.

name: dispatch-claude

on:
  repository_dispatch:
    types: [claude-dispatch]

# One live agent run per Jira issue per stage (docs/01 §7.3 serialization rule).
concurrency:
  group: claude-${{ github.event.client_payload.workItemId }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # only needed for the OIDC / Bedrock-Vertex-Foundry auth variants

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A missing/placeholder ANTHROPIC_API_KEY otherwise burns a 60-minute run AND a
      # D14 attempt tick before anyone sees an error — fail in seconds instead. If you
      # switched the Claude step to OIDC / Bedrock / Vertex / Foundry auth, delete this
      # guard or adapt it to the auth input you use.
      - name: Preflight — fail fast when Claude auth is missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No Claude credential: set ANTHROPIC_API_KEY (API billing) or CLAUDE_CODE_OAUTH_TOKEN (subscription billing via 'claude setup-token'), or switch to an OIDC variant. Failing fast so this costs seconds, not a 60-minute run plus an attempt tick."
            exit 1
          fi
          case "$ANTHROPIC_API_KEY" in
            change-me*) echo "::error::ANTHROPIC_API_KEY is still the 'change-me' placeholder — set a real key."; exit 1 ;;
          esac

      - name: Run Claude Code (automation mode)
        uses: anthropics/claude-code-action@v1
        with:
          # Auth option A (simplest): vaulted Console key.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Auth option B (no static secret): OIDC workload identity federation —
          # replace the line above with:
          #   anthropic_federation_rule_id: <RULE_ID>
          # Auth option C (bank cloud): use_bedrock / use_vertex / use_foundry with
          # cloud OIDC — the Action is the one Claude surface portable to those clouds.
          #
          # The agent/claude/ branch prefix in the prompt below is the relay's
          # completion-correlation contract (CLAUDE_BRANCH_PREFIX in apps/cli
          # templates.ts; the relay reads env PDLC_CLAUDE_BRANCH_PREFIX with the same
          # default). Pinned by packages/dispatch/test/kit-contract.test.ts — change
          # all sides together.
          prompt: |
            Work item: ${{ github.event.client_payload.workItemId }}
            Risk tier: ${{ github.event.client_payload.riskTier }} (autonomy ${{ github.event.client_payload.autonomy }})
            Plan-first: ${{ github.event.client_payload.planFirst }}

            ${{ github.event.client_payload.prompt }}

            Follow AGENTS.md. Branch: agent/claude/${{ github.event.client_payload.workItemId }}-<slug>.
            PR title MUST start with "${{ github.event.client_payload.workItemId }}: ".
            Open the PR as a DRAFT with the full PR-template evidence sections.
            If plan-first is true: produce the plan as your only output and STOP —
            do not write code (the human "Plan Approved" transition dispatches execution, D8).
          claude_args: |
            --max-turns 50
            --model claude-sonnet-4-5
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(ls:*),Bash(mkdir:*)"
          # Deny-by-default with an explicit grant (the generic preset from `pdlc init
          # --stack`; stack presets add the repo's build tool). The builder gets `gh`
          # ONLY to open/inspect its own PR — NEVER grant `Bash(gh:*)`, `gh pr comment`,
          # or `gh pr review`: those are the critic gate's verdict channel
          # (ADVERSARIAL-REVIEW markers), and builder + critic share the `claude` app
          # login by default, so a prompt-injected builder holding them could
          # self-approve the gate. Pinned by packages/dispatch/test/kit-contract.test.ts.
